<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
    <script src="register.js" defer></script>

  </head>
<body>
    <main>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Crear Cuenta</h1>


            <form id="registerForm">
                <div class="form-group">
                  <label for="name" class="sr-only">Nombre</label>
                    <input type="text" name="name" id="name" placeholder="Nombre" required>

                  <label for="apellido" class="sr-only">Apellido</label>
                    <input type="text" name="apellido" id="apellido" placeholder="Apellido" required>

                  <label for="email" class="sr-only">email</label>
                    <input type="email" name="email" id="email" placeholder="Correo electrónico*" required>
           
                  <label for="password" class="sr-only">password</label>
                    <input type="password" name="password" id="password" placeholder="Contraseña*" required>

                  <label for="confirmPassword" class="sr-only">Confirmar Contraseña</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirmar Contraseña*" required>
                     
                </div>
                <button type="submit" class="btn">Registrarse</button>
                <div id="errorMessage" class="error-Message"></div> <div id="successMessage" class="success-message"></div> 
                
                <p class="error-message ">ERROR AL REGISTRARSE</p>
                
            </form>
            
            
            <p class="auth-switch">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p>
        </div>
    </div>
 
</main>
